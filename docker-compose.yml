
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: siged_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  db_cursos:
    image: postgres:15-alpine
    container_name: siged_db_cursos
    environment:
      POSTGRES_DB: cursos_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

  db_usuarios:
    image: postgres:15-alpine
    container_name: siged_db_usuarios
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

  db_evaluaciones:
    image: postgres:15-alpine
    container_name: siged_db_evaluaciones
    environment:
      POSTGRES_DB: evaluaciones_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

  db_notificaciones:
    image: postgres:15-alpine
    container_name: siged_db_notificaciones
    environment:
      POSTGRES_DB: notificaciones_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

  ms-cursos:
    build: ./ms-cursos
    container_name: siged_ms_cursos
    environment:
      - DB_HOST=db_cursos
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - db_cursos
      - rabbitmq

  ms-usuarios:
    build: ./ms-usuarios
    container_name: siged_ms_usuarios
    environment:
      - DB_HOST=db_usuarios
      - POSTGRES_DB=usuarios_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    depends_on:
      - db_usuarios
      - rabbitmq

  api-gateway:
    build: ./api-gateway
    container_name: siged_api_gateway
    ports:
      - "4000:4000"
    depends_on:
      - ms-usuarios
