# Contrato GraphQL entre el frontend y el api-gateway.
# Cada integrante agrega aquí los tipos de su módulo (integracion.md, C1).
# El gateway usa una copia en api-gateway/src/schema/schema.graphql: si cambias este archivo, cópialo allá.

# ---------------------------------------------------------------
# Módulo usuarios (Isauro) -> ms-usuarios
# ---------------------------------------------------------------

enum Rol {
  ADMINISTRADOR
  DOCENTE
  ESTUDIANTE
}

enum EstadoInscripcion {
  PENDIENTE
  ACTIVA
  RECHAZADA
  CANCELADA
  FINALIZADA
}

type Usuario {
  id: ID!
  email: String!
  nombres: String!
  apellidos: String!
  rol: Rol!
  activo: Boolean!
}

type AuthPayload {
  token: String!
  usuario: Usuario!
}

type Inscripcion {
  id: ID!
  cursoId: ID!
  estudianteId: ID!
  estado: EstadoInscripcion!
  motivoRechazo: String
  fechaInscripcion: String!
  "Lo resuelve el módulo cursos. Es null si ms-cursos no responde."
  curso: Curso
}

"Datos del docente que ms-usuarios entrega a otros servicios (DocenteExternoDto)"
type Docente {
  id: ID!
  nombreCompleto: String!
  correo: String!
  activo: Boolean!
}

input RegistroInput {
  nombres: String!
  apellidos: String!
  email: String!
  password: String!
}

input CrearUsuarioInput {
  nombres: String!
  apellidos: String!
  email: String!
  password: String!
  rol: Rol!
}

# ---------------------------------------------------------------
# Módulo cursos (Cristian) -> ms-cursos
# ---------------------------------------------------------------

enum NivelCurso {
  BASICO
  INTERMEDIO
  AVANZADO
}

enum EstadoCurso {
  BORRADOR
  PUBLICADO
  EN_CURSO
  FINALIZADO
  ARCHIVADO
}

type Modulo {
  id: ID!
  titulo: String!
  descripcion: String
  orden: Int!
  duracionMinutos: Int!
  recursoUrl: String
}

type Curso {
  id: ID!
  codigo: String!
  titulo: String!
  descripcion: String
  categoria: String!
  nivel: NivelCurso!
  estado: EstadoCurso!
  docenteId: ID!
  "Lo resuelve el módulo usuarios. Es null si el docente no existe en ms-usuarios."
  docente: Docente
  cupoMaximo: Int!
  cuposDisponibles: Int!
  duracionHoras: Int!
  precio: Float!
  modulos: [Modulo!]!
  fechaCreacion: String
  fechaActualizacion: String
}

input ModuloInput {
  titulo: String!
  descripcion: String
  orden: Int!
  duracionMinutos: Int!
  recursoUrl: String
}

input CursoInput {
  codigo: String!
  titulo: String!
  descripcion: String!
  categoria: String!
  nivel: NivelCurso!
  docenteId: ID!
  cupoMaximo: Int!
  duracionHoras: Int!
  precio: Float!
  modulos: [ModuloInput!]
}

# ---------------------------------------------------------------
# Operaciones
# ---------------------------------------------------------------

type Query {
  # usuarios
  "Usuario de la sesión actual"
  me: Usuario!
  "Solo ADMINISTRADOR"
  usuarios(rol: Rol): [Usuario!]!
  "Solo ESTUDIANTE"
  misInscripciones: [Inscripcion!]!
  "Solo DOCENTE o ADMINISTRADOR"
  inscritosCurso(cursoId: ID!): [Inscripcion!]!

  # cursos
  "Cursos publicados o en curso, con cupo"
  catalogoCursos: [Curso!]!
  cursos(categoria: String, estado: EstadoCurso): [Curso!]!
  curso(id: ID!): Curso
  "Si no se manda docenteId, usa el usuario de la sesión"
  misCursosDocente(docenteId: ID): [Curso!]!
}

type Mutation {
  # usuarios
  "Público"
  login(email: String!, password: String!): AuthPayload!
  "Público, siempre crea un ESTUDIANTE"
  registro(input: RegistroInput!): Usuario!
  "Solo ADMINISTRADOR, crea DOCENTE o ADMINISTRADOR"
  crearUsuario(input: CrearUsuarioInput!): Usuario!
  "Solo ADMINISTRADOR"
  cambiarEstadoUsuario(id: ID!, activo: Boolean!): Usuario!
  "Solo ESTUDIANTE"
  inscribirse(cursoId: ID!): Inscripcion!
  "Dueño de la inscripción o ADMINISTRADOR"
  cancelarInscripcion(id: ID!): Inscripcion!

  # cursos (los permisos los revisa ms-cursos con X-User-Id y X-User-Rol)
  crearCurso(input: CursoInput!): Curso!
  actualizarCurso(id: ID!, input: CursoInput!): Curso!
  cambiarEstadoCurso(id: ID!, estado: EstadoCurso!): Curso!
  agregarModulo(cursoId: ID!, input: ModuloInput!): Modulo!
  actualizarModulo(cursoId: ID!, moduloId: ID!, input: ModuloInput!): Modulo!
  eliminarModulo(cursoId: ID!, moduloId: ID!): Boolean!
  eliminarCurso(id: ID!): Boolean!
}

# ---------------------------------------------------------------
# Módulo notificaciones y certificados (María) -> ms-certificados
# Se agrega con "extend" para no tocar los tipos de otros módulos.
# ---------------------------------------------------------------

enum EstadoNotificacion {
  ENVIADA
  LEIDA
}

type Notificacion {
  id: ID!
  estudianteId: ID!
  cursoId: ID
  "INSCRIPCION, INSCRIPCION_RECHAZADA, CURSO_INICIADO, CURSO_FINALIZADO, EVALUACION_NUEVA, NOTA, NOTA_FINAL o CERTIFICADO"
  tipo: String!
  mensaje: String!
  estado: EstadoNotificacion!
  fecha: String!
}

type Certificado {
  id: ID!
  codigoVerificacion: String!
  estudianteId: ID!
  cursoId: ID!
  codigoCurso: String!
  tituloCurso: String!
  notaFinal: Float!
  fechaEmision: String!
  url: String!
}

type ArchivoPdf {
  nombreArchivo: String!
  "Contenido del PDF en base64"
  contenidoBase64: String!
}

extend type Query {
  "Usuario con sesión: sus notificaciones, la más reciente primero"
  misNotificaciones(estado: EstadoNotificacion): [Notificacion!]!
  "Usuario con sesión: cuántas notificaciones no ha leído"
  totalNoLeidas: Int!
  "Usuario con sesión: sus certificados"
  misCertificados: [Certificado!]!
  "Dueño del certificado"
  certificado(id: ID!): Certificado!
  "Público, sin token. Devuelve null si el código no existe"
  verificarCertificado(codigo: String!): Certificado
  "Dueño del certificado: PDF en base64 con su nombre (tomado de ms-usuarios)"
  certificadoPdf(id: ID!): ArchivoPdf!
}

extend type Mutation {
  "Dueño de la notificación"
  marcarNotificacionLeida(id: ID!): Notificacion!
  "Usuario con sesión: marca todas como leídas y devuelve cuántas cambiaron"
  marcarTodasLeidas: Int!
}

# ---------------------------------------------------------------
# Módulo evaluaciones (Josué) -> ms-evaluaciones
# Preguntas abiertas, una entrega por estudiante y nota total de 0 a 10.
# Se agrega con "extend" para no tocar los tipos de otros módulos.
# ---------------------------------------------------------------

enum TipoEvaluacion {
  EXAMEN
  TAREA
  PROYECTO
}

enum EstadoEvaluacion {
  BORRADOR
  PUBLICADA
  CERRADA
}

type Pregunta {
  id: ID!
  enunciado: String!
  orden: Int!
}

type Evaluacion {
  id: ID!
  cursoId: ID!
  titulo: String!
  descripcion: String
  tipo: TipoEvaluacion!
  estado: EstadoEvaluacion!
  "Porcentaje de la nota final del curso"
  peso: Float!
  "Siempre 10"
  notaMaxima: Float!
  fechaApertura: String!
  fechaCierre: String!
  moduloId: ID
  fechaCreacion: String
  preguntas: [Pregunta!]!
}

type Respuesta {
  preguntaId: ID!
  enunciado: String
  respuesta: String!
}

type Entrega {
  id: ID!
  evaluacionId: ID!
  estudianteId: ID!
  fechaEntrega: String!
  respuestas: [Respuesta!]!
}

type Calificacion {
  id: ID!
  evaluacionId: ID!
  estudianteId: ID!
  cursoId: ID!
  tituloEvaluacion: String
  nota: Float!
  "Mínimo para aprobar que aplica ms-evaluaciones a este curso"
  notaMinima: Float!
  "Lo decide ms-evaluaciones: nota >= notaMinima"
  aprobado: Boolean!
  retroalimentacion: String
  calificadoPor: ID
  fechaCalificacion: String
}

input PreguntaInput {
  enunciado: String!
  orden: Int!
}

input EvaluacionInput {
  cursoId: ID!
  titulo: String!
  descripcion: String
  tipo: TipoEvaluacion!
  peso: Float!
  "Fecha y hora de Ecuador, sin zona: 2026-11-12T08:00:00"
  fechaApertura: String!
  fechaCierre: String!
  preguntas: [PreguntaInput!]!
}

input RespuestaInput {
  preguntaId: ID!
  respuesta: String!
}

input CalificacionInput {
  estudianteId: ID!
  "Nota total de 0 a 10, un decimal"
  nota: Float!
  retroalimentacion: String
}

extend type Query {
  "Con sesión. El estudiante solo ve las publicadas y debe estar habilitado en el curso"
  evaluacionesCurso(cursoId: ID!): [Evaluacion!]!
  "DOCENTE del curso o ADMINISTRADOR: todas las entregas. ESTUDIANTE: solo la suya"
  entregasEvaluacion(evaluacionId: ID!): [Entrega!]!
  "DOCENTE del curso o ADMINISTRADOR"
  calificacionesEvaluacion(evaluacionId: ID!): [Calificacion!]!
  "Solo ESTUDIANTE: sus propias calificaciones (usa el usuario de la sesión)"
  misCalificaciones(cursoId: ID): [Calificacion!]!
}

extend type Mutation {
  "DOCENTE del curso o ADMINISTRADOR. Queda en BORRADOR"
  crearEvaluacion(input: EvaluacionInput!): Evaluacion!
  "DOCENTE del curso o ADMINISTRADOR"
  publicarEvaluacion(id: ID!): Evaluacion!
  "Solo ESTUDIANTE, una sola vez y dentro del plazo"
  entregarEvaluacion(evaluacionId: ID!, respuestas: [RespuestaInput!]!): Entrega!
  "DOCENTE del curso o ADMINISTRADOR"
  calificarEntrega(evaluacionId: ID!, input: CalificacionInput!): Calificacion!
}
