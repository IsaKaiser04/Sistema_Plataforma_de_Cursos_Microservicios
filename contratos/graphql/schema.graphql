# Contrato GraphQL entre el frontend y el api-gateway.
# Cada integrante agrega aquí los tipos de su módulo en un PR aparte (integracion.md, C1).
# El gateway usa una copia en api-gateway/src/schema/schema.graphql.

# ---------------------------------------------------------------
# Módulo usuarios (Isauro) -> ms-usuarios
# ---------------------------------------------------------------

enum Rol {
  ADMINISTRADOR
  DOCENTE
  ESTUDIANTE
}

enum EstadoInscripcion {
  PENDIENTE
  ACTIVA
  RECHAZADA
  CANCELADA
  FINALIZADA
}

type Usuario {
  id: ID!
  email: String!
  nombres: String!
  apellidos: String!
  rol: Rol!
  activo: Boolean!
}

type AuthPayload {
  token: String!
  usuario: Usuario!
}

type Inscripcion {
  id: ID!
  cursoId: ID!
  estudianteId: ID!
  estado: EstadoInscripcion!
  motivoRechazo: String
  fechaInscripcion: String!
}

input RegistroInput {
  nombres: String!
  apellidos: String!
  email: String!
  password: String!
}

input CrearUsuarioInput {
  nombres: String!
  apellidos: String!
  email: String!
  password: String!
  rol: Rol!
}

type Query {
  "Usuario de la sesión actual"
  me: Usuario!
  "Solo ADMINISTRADOR"
  usuarios(rol: Rol): [Usuario!]!
  "Solo ESTUDIANTE"
  misInscripciones: [Inscripcion!]!
  "Solo DOCENTE o ADMINISTRADOR"
  inscritosCurso(cursoId: ID!): [Inscripcion!]!
}

type Mutation {
  "Público"
  login(email: String!, password: String!): AuthPayload!
  "Público, siempre crea un ESTUDIANTE"
  registro(input: RegistroInput!): Usuario!
  "Solo ADMINISTRADOR, crea DOCENTE o ADMINISTRADOR"
  crearUsuario(input: CrearUsuarioInput!): Usuario!
  "Solo ADMINISTRADOR"
  cambiarEstadoUsuario(id: ID!, activo: Boolean!): Usuario!
  "Solo ESTUDIANTE"
  inscribirse(cursoId: ID!): Inscripcion!
  "Dueño de la inscripción o ADMINISTRADOR"
  cancelarInscripcion(id: ID!): Inscripcion!
}
