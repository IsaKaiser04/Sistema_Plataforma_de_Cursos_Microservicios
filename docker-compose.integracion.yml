# Levanta ms-usuarios y ms-cursos juntos con UN solo RabbitMQ, para probar la integración
# entre los dos (inscripción -> evento -> cupo -> acceso habilitado).
# Es temporal hasta que esté el docker-compose.yml raíz completo (integracion.md, C3).
#
#   docker compose -f docker-compose.integracion.yml up -d --build
#
# Antes apaga los compose locales de cada servicio, porque usan los mismos puertos:
#   docker compose -f ms-usuarios/docker-compose.local.yml down
#   docker compose -f ms-cursos/docker-compose.local.yml down
#
# El gateway y el frontend se corren aparte con npm (puertos 4000 y 5173).
# Panel de RabbitMQ: http://localhost:15672 (lms / lms123)
name: lms-integracion

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lms_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_usuarios:
    image: postgres:16-alpine
    container_name: lms_db_usuarios
    restart: unless-stopped
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - usuarios_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_cursos:
    image: postgres:16-alpine
    container_name: lms_db_cursos
    restart: unless-stopped
    environment:
      POSTGRES_DB: cursos_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - cursos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cursos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms-usuarios:
    build: ./ms-usuarios
    container_name: lms_ms_usuarios
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: db_usuarios
      DB_PORT: 5432
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      JWT_SECRET: secreto_local_cambiar
      RABBIT_URL: amqp://lms:lms123@rabbitmq:5672
      RABBIT_EXCHANGE: lms.eventos.exchange
      CURSOS_URL: http://ms-cursos:8081
      CURSOS_TIMEOUT_MS: 3000
      ADMIN_EMAIL: admin@unl.edu.ec
      ADMIN_PASSWORD: admin123
    depends_on:
      db_usuarios:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-cursos:
    build: ./ms-cursos
    container_name: lms_ms_cursos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db_cursos
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: lms
      RABBITMQ_PASSWORD: lms123
      # Valida los docentes contra ms-usuarios de verdad (integracion.md, C5)
      USUARIOS_SERVICE_MOCK: "false"
      USUARIOS_SERVICE_URL: http://ms-usuarios:3004
    depends_on:
      db_cursos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  # Reusa la base que ya creó ms-usuarios/docker-compose.local.yml, así no se pierden los usuarios.
  usuarios_data:
    external: true
    name: ms-usuarios_postgres_usuarios_data
  cursos_data:
