server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-cursos

  # Valores por defecto alineados exactamente con el docker-compose.yml del repositorio SIGED/LMS
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cursos_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000

# Configuracion de colas, exchanges y routing keys para eventos LMS
lms:
  messaging:
    exchange: lms.eventos.exchange
    cursos-queue: lms.cursos.eventos.queue
    cursos-routing-key: cursos.evento.#
    inscripciones-queue: lms.cursos.inscripciones.queue
    inscripciones-routing-key: inscripcion.creada
  external:
    usuarios-mock: ${USUARIOS_SERVICE_MOCK:true}
    usuarios-url: ${USUARIOS_SERVICE_URL:http://ms-usuarios:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
