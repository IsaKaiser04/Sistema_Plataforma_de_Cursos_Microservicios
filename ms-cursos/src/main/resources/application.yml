server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-cursos

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cursos_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    listener:
      simple:
        default-requeue-rejected: false

lms:
  messaging:
    exchange: lms.eventos.exchange
    inscripciones-queue: lms.cursos.inscripciones.queue
    inscripciones-creada-key: inscripcion.creada
    inscripciones-cancelada-key: inscripcion.cancelada
    dlx: lms.cursos.dlx
    dlq: lms.cursos.dlq
  external:
    usuarios-mock: ${USUARIOS_SERVICE_MOCK:true}
    usuarios-url: ${USUARIOS_SERVICE_URL:http://ms-usuarios:3004}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
