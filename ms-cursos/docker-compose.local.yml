services:
  db_cursos:
    image: postgres:15-alpine
    container_name: siged_db_cursos
    restart: unless-stopped
    environment:
      POSTGRES_DB: cursos_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_cursos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cursos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: siged_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  ms-cursos:
    build: .
    container_name: siged_ms_cursos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=db_cursos
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db_cursos:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  postgres_cursos_data:
