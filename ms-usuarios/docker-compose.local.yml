# Levanta solo ms-usuarios con su base de datos y RabbitMQ.
#   docker compose -f docker-compose.local.yml up -d --build
# Panel de RabbitMQ: http://localhost:15672 (lms / lms123)
services:
  db_usuarios:
    image: postgres:16-alpine
    container_name: lms_db_usuarios
    restart: unless-stopped
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432" # 5434 en el host para no chocar con la base de ms-cursos (5432)
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lms_rabbitmq_usuarios
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-usuarios:
    build: .
    container_name: lms_ms_usuarios
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: db_usuarios
      DB_PORT: 5432
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      JWT_SECRET: secreto_local_cambiar
      RABBIT_URL: amqp://lms:lms123@rabbitmq:5672
      RABBIT_EXCHANGE: lms.eventos.exchange
      # ms-cursos corriendo aparte en tu máquina (puerto 8081)
      CURSOS_URL: http://host.docker.internal:8081
      CURSOS_TIMEOUT_MS: 3000
      ADMIN_EMAIL: admin@unl.edu.ec
      ADMIN_PASSWORD: admin123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db_usuarios:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_usuarios_data:
